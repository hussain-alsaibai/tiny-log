[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-log"
version = "0.5.1"
description = "Zero-dependency structured logging. Like structlog/loguru in one file. 32K logs/s. v0.5.0 adds optional secret redaction via tiny_secret_mask."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["logging", "structured", "log", "json", "loguru", "structlog", "redaction", "secrets"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
redact = ["tiny-secret-mask"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-log"
Repository = "https://github.com/hussain-alsaibai/tiny-log"

[tool.setuptools]
py-modules = ["tiny_log", "tiny_log_v050"]
