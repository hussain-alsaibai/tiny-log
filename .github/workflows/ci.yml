name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # Collect the whole suite instead of listing files. The list had already
      # dropped test_v080_text_extras.py — the regression test for the 0.8.0
      # text-formatter fix — so the suite could go red without CI noticing.
      - run: python -m pytest . -v
